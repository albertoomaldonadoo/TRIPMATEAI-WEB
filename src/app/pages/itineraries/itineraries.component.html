<div class="min-h-screen bg-gradient-to-br from-blue-100 via-indigo-50 to-purple-100">
  <!-- Header -->
  <div class="bg-white border-b border-gray-200 px-8 py-4">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <button (click)="goBack()" class="text-indigo-600 hover:text-indigo-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
        </button>
        <h1 class="text-3xl font-bold text-gray-800">Mis Itinerarios</h1>
      </div>
      
      <img
        class="h-10 w-10 rounded-full object-cover ring-2 ring-indigo-500"
        [src]="'https://ui-avatars.com/api/?name=' + (user()?.name || 'Usuario') + '&background=6366f1&color=fff'"
        [alt]="user()?.name || 'Usuario'"
      />
    </div>
  </div>

  <!-- Contenido -->
  <div class="max-w-7xl mx-auto p-8">
    <!-- Loading -->
    <div *ngIf="isLoading" class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-indigo-600"></div>
    </div>

    <!-- Grid de Itinerarios -->
    <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Tarjetas de Viajes -->
      <div
        *ngFor="let trip of trips()"
        class="relative rounded-2xl shadow-xl overflow-hidden transform hover:scale-105 transition-transform duration-300 cursor-pointer group"
        (click)="viewTrip(trip)"
      >
        <img
          class="w-full h-64 object-cover"
          [src]="getDestinationImage(trip.destination)"
          [alt]="trip.destination"
        />
        
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>

        <!-- Badge de Estado -->
        <div class="absolute top-4 left-4">
          <span
            class="px-4 py-2 rounded-full text-sm font-semibold"
            [ngClass]="{
              'bg-green-500 text-white': trip.status === 'completed',
              'bg-blue-500 text-white': trip.status === 'ongoing',
              'bg-yellow-500 text-white': trip.status === 'planned'
            }"
          >
            {{getStatusText(trip.status)}}
          </span>
        </div>

        <!-- Información del Viaje -->
        <div class="absolute bottom-0 left-0 p-6 w-full">
          <p class="text-sm text-white/90 mb-2">{{formatDate(trip.startDate)}}</p>
          <h3 class="text-2xl font-bold text-white mb-2">{{trip.destination}}</h3>
          <p class="text-white/80">{{trip.origin}} → {{trip.destination}}</p>
          <p class="text-sm text-white/70 mt-2">
            {{getDuration(trip.startDate, trip.endDate)}} días
          </p>
        </div>

        <!-- Botón Eliminar -->
        <button
          (click)="deleteTrip(trip.id); $event.stopPropagation()"
          class="absolute top-4 right-4 p-2 bg-red-500 text-white rounded-full hover:bg-red-600 transition-all opacity-0 group-hover:opacity-100"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
        </button>
      </div>

      <!-- Botón Crear Nuevo Itinerario -->
      <button
        (click)="createNewTrip()"
        class="h-64 flex flex-col items-center justify-center bg-white rounded-2xl shadow-xl text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 transition-all transform hover:scale-105 border-2 border-dashed border-gray-300"
      >
        <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span class="text-lg font-semibold">Crear Nuevo Itinerario</span>
      </button>
    </div>

    <!-- Sin Itinerarios -->
    <div
      *ngIf="!isLoading && trips().length === 0"
      class="bg-white rounded-2xl shadow-xl p-12 text-center"
    >
      <svg class="w-24 h-24 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
      <h3 class="text-xl font-bold text-gray-700 mb-2">No tienes itinerarios</h3>
      <p class="text-gray-500 mb-6">Crea tu primer itinerario de viaje</p>
      <button
        (click)="createNewTrip()"
        class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors"
      >
        Crear Itinerario
      </button>
    </div>
  </div>
</div>
