<div class="min-h-screen bg-gradient-to-br from-blue-100 via-indigo-50 to-purple-100">
  <!-- Header -->
  <div class="bg-white border-b border-gray-200 px-8 py-4">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <button (click)="goBack()" class="text-indigo-600 hover:text-indigo-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
        </button>
        <h1 class="text-3xl font-bold text-gray-800">Actualizar Contactos</h1>
      </div>
      
      <img
        class="h-10 w-10 rounded-full object-cover ring-2 ring-indigo-500"
        [src]="'https://ui-avatars.com/api/?name=' + (user()?.name || 'Usuario') + '&background=6366f1&color=fff'"
        [alt]="user()?.name || 'Usuario'"
      />
    </div>
  </div>

  <!-- Contenido -->
  <div class="max-w-4xl mx-auto p-8">
    <!-- Información de Contacto Principal -->
    <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Información de Contacto Principal</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email Principal</label>
          <input
            [(ngModel)]="contacts.primaryEmail"
            type="email"
            placeholder="correo@ejemplo.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email Secundario</label>
          <input
            [(ngModel)]="contacts.secondaryEmail"
            type="email"
            placeholder="correo.secundario@ejemplo.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono Móvil</label>
          <input
            [(ngModel)]="contacts.mobile"
            type="tel"
            placeholder="+34 600 000 000"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono Alternativo</label>
          <input
            [(ngModel)]="contacts.alternativePhone"
            type="tel"
            placeholder="+34 600 000 001"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
      </div>
    </div>

    <!-- Contacto de Emergencia -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Contacto de Emergencia</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nombre Completo</label>
          <input
            [(ngModel)]="emergencyContact.name"
            type="text"
            placeholder="Nombre del contacto de emergencia"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Relación</label>
          <select
            [(ngModel)]="emergencyContact.relationship"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          >
            <option value="">Selecciona una opción</option>
            <option value="spouse">Cónyuge</option>
            <option value="parent">Padre/Madre</option>
            <option value="sibling">Hermano/a</option>
            <option value="friend">Amigo/a</option>
            <option value="other">Otro</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono de Emergencia</label>
          <input
            [(ngModel)]="emergencyContact.phone"
            type="tel"
            placeholder="+34 600 000 000"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
      </div>

      <button
        (click)="saveContacts()"
        class="mt-8 w-full px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors"
      >
        Guardar Contactos
      </button>
    </div>
  </div>
</div>
