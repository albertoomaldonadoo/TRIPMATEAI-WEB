<div class="min-h-screen bg-gradient-to-br from-blue-100 via-indigo-50 to-purple-100">
  <!-- Header -->
  <div class="bg-white border-b border-gray-200 px-8 py-4">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <button (click)="goBack()" class="text-indigo-600 hover:text-indigo-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
        </button>
        <h1 class="text-3xl font-bold text-gray-800">Mis Reservas</h1>
      </div>
      
      <img
        class="h-10 w-10 rounded-full object-cover ring-2 ring-indigo-500"
        [src]="'https://ui-avatars.com/api/?name=' + (user()?.name || 'Usuario') + '&background=6366f1&color=fff'"
        [alt]="user()?.name || 'Usuario'"
      />
    </div>
  </div>

  <!-- Contenido -->
  <div class="max-w-7xl mx-auto p-8">
    <!-- Estadísticas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <!-- Reservas Activas -->
      <div class="bg-white rounded-2xl shadow-lg p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-500 mb-1">Reservas Activas</p>
            <p class="text-3xl font-bold text-indigo-600">{{stats.active}}</p>
          </div>
          <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center">
            <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Completadas -->
      <div class="bg-white rounded-2xl shadow-lg p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-500 mb-1">Completadas</p>
            <p class="text-3xl font-bold text-green-600">{{stats.completed}}</p>
          </div>
          <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Canceladas -->
      <div class="bg-white rounded-2xl shadow-lg p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-500 mb-1">Canceladas</p>
            <p class="text-3xl font-bold text-red-600">{{stats.cancelled}}</p>
          </div>
          <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
            <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Historial de Reservas -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Historial de Reservas</h2>
      
      <div class="space-y-4">
        <div
          *ngFor="let booking of mockBookings"
          class="flex items-center justify-between p-4 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors"
        >
          <!-- Información del Vuelo -->
          <div class="flex items-center space-x-4">
            <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center">
              <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
              </svg>
            </div>
            <div>
              <p class="font-semibold text-gray-800">{{booking.route}}</p>
              <p class="text-sm text-gray-500">{{booking.date}} • {{booking.flight}}</p>
            </div>
          </div>
          
          <!-- Estado y Precio -->
          <div class="text-right">
            <span
              class="px-3 py-1 rounded-full text-sm font-semibold"
              [ngClass]="{
                'bg-green-100 text-green-700': booking.status === 'confirmed',
                'bg-red-100 text-red-700': booking.status === 'cancelled',
                'bg-blue-100 text-blue-700': booking.status === 'completed'
              }"
            >
              {{booking.status}}
            </span>
            <p class="text-lg font-bold text-indigo-600 mt-2">€{{booking.price}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
